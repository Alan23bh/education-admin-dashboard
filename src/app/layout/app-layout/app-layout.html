<!doctype html>
<div class="shell">
  <button
    class="overlay"
    type="button"
    *ngIf="sidebarOpen()"
    (click)="closeSidebar()"
    aria-label="Close menu"
  ></button>

  <aside class="sidebar" [class.open]="sidebarOpen()">
    <div class="sidebar__brand">
      <div class="logo">
        <img src="/lyman-greyhounds.png" alt="Lyman Greyhounds logo" />
      </div>
      <div class="name">
        <strong>Lyman HS</strong>
        <span>Teacher Portal</span>
      </div>
      <button
        class="icon-btn close-btn"
        type="button"
        (click)="closeSidebar()"
        aria-label="Close menu"
      >
        ✕
      </button>
    </div>

    <nav class="nav">
      <a routerLink="/app/dashboard" routerLinkActive="active" (click)="closeSidebar()">
        <span class="material-icons nav__icon" aria-hidden="true">dashboard</span>
        <span class="nav__label">Dashboard</span>
      </a>

      <a routerLink="/app/students" routerLinkActive="active" (click)="closeSidebar()">
        <span class="material-icons nav__icon" aria-hidden="true">group</span>
        <span class="nav__label">Students</span>
      </a>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="left">
        <button
          class="icon-btn menu-btn"
          type="button"
          (click)="toggleSidebar()"
          aria-label="Open menu"
        >
          ☰
        </button>

        <div class="title">Teacher Dashboard</div>
      </div>

      <button class="logout-btn" (click)="logout()">
        <span class="material-icons logout-btn__icon" aria-hidden="true">logout</span>
        <span>Logout</span>
      </button>
    </header>

    <section class="content">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
